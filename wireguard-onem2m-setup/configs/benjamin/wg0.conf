# Benjamin's WireGuard client configuration
# Place this file on Benjamin's Raspberry Pi at /etc/wireguard/wg0.conf
# Replace [BENJAMIN_LAN_SUBNET] and [CLOUD_PUBLIC_KEY] placeholders if needed.

[Interface]
# VPN address assigned to Benjamin's Pi
Address = 10.100.0.3/32
# Private key for Benjamin's Pi (already present)
PrivateKey = qGLcoZoWr6TALFSTPVsOmvexgZFfK1y9vh7EhFJfJ3A=
DNS = 1.1.1.1

# PostUp/PostDown:
# - Enable IP forwarding on the Pi
# - Allow forwarding between wg0 and the LAN interface (assumed eth0)
# - Add MASQUERADE so home LAN → wg0 is NATed (Option B)
# Replace [BENJAMIN_LAN_SUBNET] with actual home subnet (e.g., 192.168.2.0/24)
PostUp = sysctl -w net.ipv4.ip_forward=1; \
         iptables -A FORWARD -i wg0 -o eth0 -j ACCEPT; \
         iptables -A FORWARD -i eth0 -o wg0 -j ACCEPT; \
         iptables -t nat -A POSTROUTING -s [BENJAMIN_LAN_SUBNET] -o wg0 -j MASQUERADE
PostDown = sysctl -w net.ipv4.ip_forward=0; \
           iptables -D FORWARD -i wg0 -o eth0 -j ACCEPT || true; \
           iptables -D FORWARD -i eth0 -o wg0 -j ACCEPT || true; \
           iptables -t nat -D POSTROUTING -s [BENJAMIN_LAN_SUBNET] -o wg0 -j MASQUERADE || true

[Peer]
# Cloud hub (IN-CSE)
# PublicKey: cloud server public key (already populated)
PublicKey = hbSAk+YPQCxts/KBIsuqx37BpNcwRFRMxz2VQmyMTF4=
# Cloud server endpoint (public IP and WireGuard port)
Endpoint = 135.181.198.131:51820
# AllowedIPs:
# - 10.100.0.0/24: route VPN subnet through the hub
# - [OTHER_TWO_HOME_LANS]: placeholder for other homes' LAN subnets so traffic to them is routed via hub
AllowedIPs = 10.100.0.0/24, [ALPER_LAN_SUBNET], [TAHIR_LAN_SUBNET]
# Helps keep NAT traversal alive
PersistentKeepalive = 25
