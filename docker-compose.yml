version: '3.8'
services:
  acme:
    image: ankraft/acme-onem2m-cse:latest
    container_name: acme-onem2m-cse
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - CSE_ORIGIN=admin:admin
      # Enable HTTP Basic Authentication
      - ACME_HTTP_SECURITY_ENABLEBASICAUTH=true
    volumes:
      - ./cse:/cse
      - acme-data:/cse/data
    networks:
      - in-cse-net

  mood:
    build: ./mood-service
    container_name: mood
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - CSE_BASE=${CSE_BASE}
      - CSE_ORIGIN=${CSE_ORIGIN}
      - MOOD_NOTIFY=${MOOD_NOTIFY}
      - ROOM_IDS=${ROOM_IDS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - acme
      - postgres
    networks:
      - in-cse-net

  postgres:
    image: postgres:15
    container_name: onem2m_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - in-cse-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - postgres
    networks:
      - in-cse-net

  ingest:
    build: ./ingest
    container_name: ingest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - in-cse-net
    depends_on:
      - postgres
    ports:
      - "8089:8088"

volumes:
  acme-data:
    driver: local
  postgres-data:
    driver: local
  grafana-data:
    driver: local

networks:
  in-cse-net:
    driver: bridge
